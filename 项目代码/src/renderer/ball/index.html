<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'" />
  <title>悬浮球</title>
  <link rel="stylesheet" href="../shared/base.css" />
  <link rel="stylesheet" href="ball.css" />
</head>
<body class="transparent">
  <!-- 第二十六轮：圆形小气泡环绕悬浮球（iOS 辅助触控那种观感）。
       窗口固定 200×200，球与每个气泡的位置都由主进程下发的 layout 决定（见 ball/app.js），
       所以无论球贴在屏幕哪一侧，气泡都会朝屏幕内侧张开。 -->
  <div class="ball-wrap" id="wrap" data-open="false" data-side="center">
    <div class="ball-bubbles" id="fan" role="menu" aria-hidden="true">
      <button class="bubble interactive" role="menuitem" data-act="settings" data-label="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </button>
      <button class="bubble interactive" role="menuitem" data-act="input" data-label="输入翻译" aria-label="输入翻译">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2.8" y="7.2" width="18.4" height="9.6" rx="2.2" />
          <path d="M6.4 10.8h.02M9.2 10.8h.02M12 10.8h.02M14.8 10.8h.02M17.6 10.8h.02M7.2 13.9h9.6" />
        </svg>
      </button>
      <button class="bubble interactive" role="menuitem" data-act="hud" data-label="显示浮窗" aria-label="显示浮窗">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4.8" width="18" height="14.4" rx="2.2" />
          <path d="M3 9.4h18" />
        </svg>
      </button>
      <button class="bubble interactive danger" role="menuitem" data-act="quit" data-label="退出即译" aria-label="退出即译">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3.8v7.4" />
          <path d="M7.4 6.6a7.2 7.2 0 1 0 9.2 0" />
        </svg>
      </button>
    </div>
    <div id="ball" class="interactive" title="单击打开 · 悬停看选项 · 拖动可移动">
      <img id="ball-icon" src="../../../assets/app.png" alt="即译" draggable="false" />
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
